[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.4"
publish = false
license = "FSL-1.1-ALv2"

[workspace.dependencies]
daroyan-core = { path = "crates/daroyan-core" }
daroyan-migration = { path = "crates/daroyan-migration" }
daroyan-protocol = { path = "crates/daroyan-protocol" }
anyhow = "1.0.104"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.22"
cookie = { version = "0.18", features = ["percent-encode"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
croner = "4.0.1"
dotenvy = "0.15.7"
duckdb = { version = "1.10506.0", features = ["bundled"] }
http-body-util = "0.1.3"
hyper = { version = "1.8", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta"] }
hex = "0.4.3"
ipnet = "2.12.2"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = "0.14.4"
rand = "0.9"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "with-chrono", "with-json"] }
sha2 = "0.10.9"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "decompression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-axum = "0.3.0"
clap = { version = "4.5", features = ["derive"] }
flexi_logger = "0.31.2"
log = "0.4"
nix = { version = "0.31", features = ["fs"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rust-embed = { version = "8.7", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
form_urlencoded = "1.2.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36.1"
serde_norway = "0.9.42"
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
manual_range_contains = "allow"
wildcard_in_or_patterns = "allow"
as_underscore = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
deref_by_slicing = "warn"
disallowed_methods = "warn"
doc_markdown = "warn"
elidable_lifetime_names = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
get_unwrap = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
manual_is_variant_and = "warn"
match_wildcard_for_single_variants = "warn"
mut_mut = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
needless_raw_strings = "warn"
range_plus_one = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
uninlined_format_args = "warn"
unnecessary_self_imports = "warn"
unnecessary_semicolon = "warn"
unnested_or_patterns = "warn"
unseparated_literal_suffix = "warn"
[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release-api]
inherits = "release"
lto = false
codegen-units = 16
